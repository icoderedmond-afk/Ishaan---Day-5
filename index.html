<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waluigi Run!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #5c94fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">WALUIGI RUN! | SCORE: <span id="score">00000</span></div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

// Handle Window Resizing
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- GAME CONSTANTS & WORLD CONFIG ---
const GRAVITY = 0.55;
const TILE_SIZE = 32;
const LEVEL_LENGTH = 25000; // Large 3-minute Mario Run style level

// --- INPUT HANDLER ---
const keys = {};
let jumpRequested = false;

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        jumpRequested = true;
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('pointerdown', () => { jumpRequested = true; });

// --- GAME STATE ---
let score = 0;
let cameraX = 0;
let gameOver = false;
let gameWon = false;
let animTimer = 0;

// Player (Waluigi) Object
const player = {
    x: 100,
    y: 300,
    w: 28,
    h: 46,
    vx: 0,
    vy: 0,
    speed: 4.2, // Base Mario Run auto-run speed
    grounded: false,
    wallSliding: false,
    wallDir: 0,
    isSuper: false
};

// Level Object Collections
let platforms = [];
let bricks = [];
let qBlocks = [];
let pipes = [];
let enemies = [];
let powerups = [];
let flagpole = { x: LEVEL_LENGTH - 400, y: 0, w: 20, h: 300 };

// --- LEVEL GENERATOR ---
function generateLevel() {
    platforms = [];
    bricks = [];
    qBlocks = [];
    pipes = [];
    enemies = [];
    powerups = [];
    score = 0;
    gameOver = false;
    gameWon = false;
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;

    let x = 0;
    const floorY = canvas.height - 64;
    flagpole.y = floorY - 280;

    while (x < LEVEL_LENGTH - 600) {
        // Pit Gaps for Parkour Dynamics
        if (x > 800 && Math.random() < 0.18) {
            x += Math.floor(Math.random() * 120 + 100);
        }

        let segLen = Math.floor(Math.random() * 600 + 400);

        // Ground Floor Tiles
        for (let bx = x; bx < x + segLen; bx += TILE_SIZE) {
            platforms.push({ x: bx, y: floorY, w: TILE_SIZE, h: TILE_SIZE * 2 });
        }

        // Pipe Obstacles
        if (Math.random() < 0.35) {
            let px = x + 150;
            let ph = Math.floor(Math.random() * 40 + 64);
            pipes.push({ x: px, y: floorY - ph, w: 54, h: ph });
        }

        // Bricks & Question Blocks Structures
        if (segLen > 350) {
            let midX = x + segLen / 2;
            qBlocks.push({ x: midX - 32, y: floorY - 130, w: 32, h: 32, active: true });
            bricks.push({ x: midX, y: floorY - 130, w: 32, h: 32 });
            qBlocks.push({ x: midX + 32, y: floorY - 130, w: 32, h: 32, active: true });

            // Elevated Step Bricks (Parkour)
            if (Math.random() < 0.5) {
                for (let i = 0; i < 4; i++) {
                    bricks.push({ x: midX + 120 + (i * 32), y: floorY - 210, w: 32, h: 32 });
                }
            }

            // Enemies
            let eType = Math.random() < 0.5 ? 'goomba' : 'koopa';
            enemies.push({
                x: midX + 60,
                y: floorY - (eType === 'koopa' ? 44 : 30),
                w: 30,
                h: eType === 'koopa' ? 44 : 30,
                type: eType,
                vx: -1.5,
                alive: true
            });
        }

        x += segLen;
    }

    // Final Landing Platform before Flag
    for (let bx = LEVEL_LENGTH - 600; bx < LEVEL_LENGTH + 200; bx += TILE_SIZE) {
        platforms.push({ x: bx, y: floorY, w: TILE_SIZE, h: TILE_SIZE * 2 });
    }
}

// --- PHYSICS & COLLISION HELPERS ---
function checkAABB(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

// --- UPDATE LOOP ---
function update() {
    if (gameOver || gameWon) {
        if (jumpRequested) generateLevel();
        jumpRequested = false;
        return;
    }

    animTimer++;

    // Horizontal Movement Dynamics (Mario Run Auto-Forward Runner)
    let accel = player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) accel += 1.8;
    if (keys['ArrowLeft'] || keys['KeyA']) accel -= 2.0;

    player.vx = accel;
    player.x += player.vx;

    // Apply Gravity
    player.vy += GRAVITY;
    player.y += player.vy;

    player.grounded = false;
    player.wallSliding = false;

    // Platform & Floor Collisions
    platforms.forEach(p => {
        if (checkAABB(player, p)) {
            if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 12) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    // Pipe Collisions (Top & Side Walls)
    pipes.forEach(p => {
        if (checkAABB(player, p)) {
            // Landing on pipe top
            if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 10) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
            } else {
                // Wall Sliding Physics
                player.wallSliding = true;
                player.wallDir = player.x < p.x ? -1 : 1;
                if (player.vy > 0) player.vy = 1.8; // Slide drag
                player.x = player.wallDir === -1 ? p.x - player
