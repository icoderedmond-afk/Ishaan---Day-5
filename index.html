<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Waluigi Run - Full Mario Style Level</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; background:#87CEEB; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
// ====== CONFIG ======
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 960;
canvas.height = 540;

const TILE = 48;
const GRAVITY = 0.7;
const FRICTION = 0.85;
const MAX_RUN_SPEED = 8;
const ACCEL = 0.6;
const JUMP_FORCE = 14;
const WALL_JUMP_FORCE_X = 10;
const WALL_JUMP_FORCE_Y = 14;

// ====== INPUT ======
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// ====== ASSETS (replace with your own image files in same folder) ======
const images = {};
function loadImage(name, src) {
  const img = new Image();
  img.src = src;
  images[name] = img;
}
loadImage("bg", "bg_parallax.png");           // big sky / hills background
loadImage("tiles", "tileset.png");            // ground, bricks, slopes, pipes, etc.
loadImage("waluigi", "waluigi.png");
loadImage("goomba", "goomba.png");
loadImage("koopa", "koopa.png");
loadImage("coin", "coin.png");
loadImage("question", "question_box.png");
loadImage("question_hit", "question_box_hit.png");
loadImage("pipe", "pipe.png");
loadImage("flag", "flag.png");

// ====== CAMERA ======
let cameraX = 0;

// ====== PLAYER ======
const player = {
  x: 100,
  y: 200,
  w: 32,
  h: 64,
  vx: 0,
  vy: 0,
  onGround: false,
  facing: 1,
  canWallJumpLeft: false,
  canWallJumpRight: false,
  animTime: 0
};

// ====== LEVEL DATA ======
// Tile codes:
// 0 = empty
// 1 = solid ground
// 2 = brick block
// 3 = slope up right
// 4 = slope up left
// 5 = pipe top
// 6 = pipe body
// 7 = question box
// 8 = flag base
// 9 = flag pole
// (You can expand as needed)
const levelWidth = 400; // 400 tiles * 48px ≈ 19200px (~3 min run)
const levelHeight = 12;

let level = [];
for (let y = 0; y < levelHeight; y++) {
  level[y] = [];
  for (let x = 0; x < levelWidth; x++) {
    level[y][x] = 0;
  }
}

// ====== LEVEL DESIGN (hand-crafted sections) ======
// Ground base
for (let x = 0; x < levelWidth; x++) {
  level[10][x] = 1;
  level[11][x] = 1;
}

// Section 1: intro, simple jumps
for (let x = 0; x < 40; x++) {
  if (x % 8 === 3) level[9][x] = 2;
  if (x % 10 === 5) level[8][x] = 7;
}

// Section 2: pipes and enemies
for (let x = 40; x < 80; x++) {
  if (x === 50 || x === 65) {
    level[9][x] = 5;
    level[8][x] = 6;
    level[7][x] = 6;
  }
}

// Section 3: slopes up and down
for (let i = 0; i < 20; i++) {
  level[9][80 + i] = 3; // slope up right
}
for (let i = 0; i < 20; i++) {
  level[9][100 + i] = 4; // slope up left
}

// Section 4: high platforms, wall jump area
for (let x = 140; x < 160; x++) {
  level[6][x] = 2;
}
for (let x = 160; x < 180; x++) {
  level[4][x] = 2;
}
for (let x = 180; x < 200; x++) {
  level[6][x] = 2;
}

// Section 5: question box corridor
for (let x = 200; x < 240; x++) {
  if (x % 3 === 0) level[7][x] = 7;
}

// Section 6: more pipes, slopes, tricky jumps
for (let x = 240; x < 280; x++) {
  if (x === 250 || x === 270) {
    level[9][x] = 5;
    level[8][x] = 6;
    level[7][x] = 6;
  }
}
for (let i = 0; i < 30; i++) {
  level[9][280 + i] = (i < 15) ? 3 : 4;
}

// Section 7: final stretch, coins, flag
for (let x = 320; x < 360; x++) {
  if (x % 4 === 0) level[8][x] = 7;
}
const flagXTile = 380;
level[9][flagXTile] = 8;
for (let y = 3; y <= 9; y++) {
  level[y][flagXTile] = 9;
}

// ====== QUESTION BOX STATE ======
let questionBoxes = []; // {x,y,hit,anim}
for (let y = 0; y < levelHeight; y++) {
  for (let x = 0; x < levelWidth; x++) {
    if (level[y][x] === 7) {
      questionBoxes.push({x, y, hit:false, anim:0});
    }
  }
}

// ====== COINS ======
let coins = []; // {x,y,collected}
for (let y = 0; y < levelHeight; y++) {
  for (let x = 0; x < levelWidth; x++) {
    if (level[y][x] === 7 && Math.random() < 0.6) {
      coins.push({x: x*TILE + TILE/2, y: y*TILE - 20, collected:false, vy:-0.5});
    }
  }
}

// ====== ENEMIES ======
let goombas = [];
let koopas = [];
function addGoomba(px, py) {
  goombas.push({x:px, y:py, w:32, h:32, vx:1.2, vy:0, onGround:false, dead:false});
}
function addKoopa(px, py) {
  koopas.push({x:px, y:py, w:32, h:40, vx:1.0, vy:0, onGround:false, dead:false});
}

// Place enemies along level
for (let i = 60; i < 360; i += 30) addGoomba(i*TILE, 9*TILE);
for (let i = 100; i < 360; i += 60) addKoopa(i*TILE, 9*TILE);

// ====== PIPE ANIMATION ======
let pipeAnimTime = 0;

// ====== UTILS ======
function getTile(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= levelWidth || ty >= levelHeight) return 0;
  return level[ty][tx];
}

function rectVsRect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ====== PHYSICS & COLLISION ======
function handlePlayerPhysics() {
  // Horizontal accel
  let left = keys["ArrowLeft"] || keys["a"];
  let right = keys["ArrowRight"] || keys["d"];
  let up = keys["ArrowUp"] || keys["w"];

  if (left) {
    player.vx -= ACCEL;
    player.facing = -1;
  } else if (right) {
    player.vx += ACCEL;
    player.facing = 1;
  } else {
    player.vx *= FRICTION;
  }

  if (player.vx > MAX_RUN_SPEED) player.vx = MAX_RUN_SPEED;
  if (player.vx < -MAX_RUN_SPEED) player.vx = -MAX_RUN_SPEED;

  // Gravity
  player.vy += GRAVITY;

  // Wall detection for wall jumps
  player.canWallJumpLeft = false;
  player.canWallJumpRight = false;

  // Move X
  player.x += player.vx;
  resolveCollisions(player, true);

  // Move Y
  player.y += player.vy;
  player.onGround = false;
  resolveCollisions(player, false);

  // Jump
  if (up) {
    if (player.onGround) {
      player.vy = -JUMP_FORCE;
      player.onGround = false;
    } else if (player.canWallJumpLeft) {
      player.vx = WALL_JUMP_FORCE_X;
      player.vy = -WALL_JUMP_FORCE_Y;
    } else if (player.canWallJumpRight) {
      player.vx = -WALL_JUMP_FORCE_X;
      player.vy = -WALL_JUMP_FORCE_Y;
    }
  }
}

function resolveCollisions(obj, horizontal) {
  const steps = 3;
  for (let i = 0; i < steps; i++) {
    let tx1 = Math.floor(obj.x / TILE);
    let ty1 = Math.floor(obj.y / TILE);
    let tx2 = Math.floor((obj.x + obj.w) / TILE);
    let ty2 = Math.floor((obj.y + obj.h) / TILE);

    for (let ty = ty1; ty <= ty2; ty++) {
      for (let tx = tx1; tx <= tx2; tx++) {
        let t = getTile(tx, ty);
        if (t === 0) continue;

        let tileX = tx * TILE;
        let tileY = ty * TILE;

        // Slopes
        if (t === 3 || t === 4) {
          // simple slope: adjust Y based on X inside tile
          let relX = (obj.x + obj.w/2) - tileX;
          let slopeHeight;
          if (t === 3) { // up right
            slopeHeight = TILE - (relX / TILE) * TILE;
          } else { // up left
            slopeHeight = (relX / TILE) * TILE;
          }
          let groundY = tileY + slopeHeight - obj.h;
          if (obj.y + obj.h > tileY && obj.y + obj.h < tileY + TILE + 20 && obj.y > groundY - 40) {
            obj.y = groundY;
            obj.vy = 0;
            if (obj === player) player.onGround = true;
          }
          continue;
        }

        // Solid blocks, pipes, bricks, etc.
        if (rectVsRect(obj.x, obj.y, obj.w, obj.h, tileX, tileY, TILE, TILE)) {
          if (horizontal) {
            if (obj.vx > 0) {
              obj.x = tileX - obj.w;
              obj.vx = 0;
              if (obj === player) player.canWallJumpRight = true;
            } else if (obj.vx < 0) {
              obj.x = tileX + TILE;
              obj.vx = 0;
              if (obj === player) player.canWallJumpLeft = true;
            }
          } else {
            if (obj.vy > 0) {
              obj.y = tileY - obj.h;
              obj.vy = 0;
              if (obj === player) player.onGround = true;
            } else if (obj.vy < 0) {
              obj.y = tileY + TILE;
              obj.vy = 0;
              // hit question box from below
              if (t === 7 && obj === player) {
                hitQuestionBox(tx, ty);
              }
            }
          }
        }
      }
    }
  }
}

function hitQuestionBox(tx, ty) {
  let qb = questionBoxes.find(q => q.x === tx && q.y === ty);
  if (qb && !qb.hit) {
    qb.hit = true;
    qb.anim = 0;
    // spawn coin above
    coins.push({
      x: tx*TILE + TILE/2,
      y: ty*TILE - 20,
      collected:false,
      vy:-2
    });
  }
}

// ====== ENEMY PHYSICS ======
function handleEnemyPhysics(enemyArray) {
  enemyArray.forEach(e => {
    if (e.dead) return;
    e.vy += GRAVITY;
    e.x += e.vx;
    resolveCollisions(e, true);
    e.y += e.vy;
    e.onGround = false;
    resolveCollisions(e, false);

    // simple AI: turn around at edges
    if (e.onGround) {
      let frontX = e.x + (e.vx > 0 ? e.w + 2 : -2);
      let frontY = e.y + e.h + 2;
      let tx = Math.floor(frontX / TILE);
      let ty = Math.floor(frontY / TILE);
      if (getTile(tx, ty) === 0) e.vx *= -1;
    }

    // player collision
    if (!e.dead && rectVsRect(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h)) {
      if (player.vy > 0) {
        e.dead = true;
        player.vy = -10;
      } else {
        alert("Waluigi died! Refresh to try again.");
      }
    }
  });
}

// ====== COIN UPDATE ======
function updateCoins() {
  coins.forEach(c => {
    if (!c.collected) {
      c.y += c.vy;
      c.vy += 0.2;
      if (rectVsRect(player.x, player.y, player.w, player.h, c.x-12, c.y-12, 24, 24)) {
        c.collected = true;
      }
    }
  });
}

// ====== QUESTION BOX ANIM ======
function updateQuestionBoxes(dt) {
  questionBoxes.forEach(q => {
    q.anim += dt;
  });
}

// ====== PIPE ANIM ======
function updatePipes(dt) {
  pipeAnimTime += dt;
}

// ====== FLAG CHECK ======
function checkFlag() {
  const flagX = flagXTile * TILE;
  if (rectVsRect(player.x, player.y, player.w, player.h, flagX, 3*TILE, TILE, 7*TILE)) {
    alert("You reached the flag! Waluigi wins!");
  }
}

// ====== CAMERA UPDATE ======
function updateCamera() {
  cameraX = player.x - canvas.width / 2;
  if (cameraX < 0) cameraX = 0;
  const maxCam = levelWidth*TILE - canvas.width;
  if (cameraX > maxCam) cameraX = maxCam;
}

// ====== DRAW ======
function drawBackground() {
  const bg = images["bg"];
  if (!bg.complete) {
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    return;
  }
  const parallax = 0.3;
  let bgX = -cameraX * parallax;
  let w = bg.width;
  while (bgX < canvas.width) {
    ctx.drawImage(bg, bgX, 0, w, canvas.height);
    bgX += w;
  }
}

function drawTiles() {
  const tilesImg = images["tiles"];
  for (let y = 0; y < levelHeight; y++) {
    for (let x = 0; x < levelWidth; x++) {
      let t = level[y][x];
      if (t === 0) continue;
      let screenX = x*TILE - cameraX;
      let screenY = y*TILE;
      if (screenX < -TILE || screenX > canvas.width + TILE) continue;

      // simple tile rendering: use different regions of tileset
      if (!tilesImg.complete) {
        ctx.fillStyle = "#654321";
        if (t === 1) ctx.fillStyle = "#654321";
        if (t === 2) ctx.fillStyle = "#b5651d";
        if (t === 3 || t === 4) ctx.fillStyle = "#888888";
        if (t === 5 || t === 6) ctx.fillStyle = "#008000";
        if (t === 8 || t === 9) ctx.fillStyle = "#ffffff";
        ctx.fillRect(screenX, screenY, TILE, TILE);
      } else {
        // choose tile index
        let sx = 0, sy = 0;
        if (t === 1) { sx = 0; sy = 0; }       // ground
        if (t === 2) { sx = TILE; sy = 0; }   // brick
        if (t === 3) { sx = 2*TILE; sy = 0; } // slope right
        if (t === 4) { sx = 3*TILE; sy = 0; } // slope left
        if (t === 5) { sx = 0; sy = TILE; }   // pipe top
        if (t === 6) { sx = TILE; sy = TILE; }// pipe body
        if (t === 8) { sx = 2*TILE; sy = TILE;}// flag base
        if (t === 9) { sx = 3*TILE; sy = TILE;}// flag pole
        ctx.drawImage(tilesImg, sx, sy, TILE, TILE, screenX, screenY, TILE, TILE);
      }
    }
  }
}

function drawQuestionBoxes() {
  questionBoxes.forEach(q => {
    let screenX = q.x*TILE - cameraX;
    let screenY = q.y*TILE;
    if (screenX < -TILE || screenX > canvas.width + TILE) return;

    let img = q.hit ? images["question_hit"] : images["question"];
    if (!img.complete) {
      ctx.fillStyle = q.hit ? "#aaaaaa" : "#ffdd00";
      // simple bounce animation
      let offset = Math.sin(q.anim*10)*2;
      ctx.fillRect(screenX, screenY + offset, TILE, TILE);
    } else {
      let offset = Math.sin(q.anim*10)*2;
      ctx.drawImage(img, screenX, screenY + offset, TILE, TILE);
    }
  });
}

function drawCoins() {
  coins.forEach(c => {
    if (c.collected) return;
    let screenX = c.x - cameraX;
    let screenY = c.y;
    if (screenX < -32 || screenX > canvas.width + 32) return;
    let img = images["coin"];
    if (!img.complete) {
      ctx.fillStyle = "gold";
      ctx.beginPath();
      ctx.arc(screenX, screenY, 10, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.drawImage(img, screenX-12, screenY-12, 24, 24);
    }
  });
}

function drawPipesAnimation() {
  // already drawn as tiles, but we can overlay subtle glow
  let glow = (Math.sin(pipeAnimTime*3)+1)*0.2;
  ctx.fillStyle = `rgba(0,255,0,${glow})`;
  for (let y = 0; y < levelHeight; y++) {
    for (let x = 0; x < levelWidth; x++) {
      let t = level[y][x];
      if (t === 5 || t === 6) {
        let screenX = x*TILE - cameraX;
        let screenY = y*TILE;
        if (screenX < -TILE || screenX > canvas.width + TILE) continue;
        ctx.fillRect(screenX, screenY, TILE, TILE);
      }
    }
  }
}

function drawEnemies() {
  goombas.forEach(g => {
    if (g.dead) return;
    let screenX = g.x - cameraX;
    let screenY = g.y;
    if (screenX < -64 || screenX > canvas.width + 64) return;
    let img = images["goomba"];
    if (!img.complete) {
      ctx.fillStyle = "#8b4513";
      ctx.fillRect(screenX, screenY, g.w, g.h);
    } else {
      ctx.drawImage(img, screenX, screenY, g.w, g.h);
    }
  });

  koopas.forEach(k => {
    if (k.dead) return;
    let screenX = k.x - cameraX;
    let screenY = k.y;
    if (screenX < -64 || screenX > canvas.width + 64) return;
    let img = images["koopa"];
    if (!img.complete) {
      ctx.fillStyle = "#008000";
      ctx.fillRect(screenX, screenY, k.w, k.h);
    } else {
      ctx.drawImage(img, screenX, screenY, k.w, k.h);
    }
  });
}

function drawPlayer() {
  let screenX = player.x - cameraX;
  let screenY = player.y;
  let img = images["waluigi"];
  if (!img.complete) {
    ctx.fillStyle = "purple";
    ctx.fillRect(screenX, screenY, player.w, player.h);
  } else {
    ctx.save();
    ctx.translate(screenX + player.w/2, screenY);
    ctx.scale(player.facing, 1);
    ctx.drawImage(img, -player.w/2, 0, player.w, player.h);
    ctx.restore();
  }
}

// ====== MAIN LOOP ======
let lastTime = performance.now();
function loop(time) {
  let dt = (time - lastTime) / 1000;
  lastTime = time;

  handlePlayerPhysics();
  handleEnemyPhysics(goombas);
  handleEnemyPhysics(koopas);
  updateCoins();
  updateQuestionBoxes(dt);
  updatePipes(dt);
  checkFlag();
  updateCamera();

  // DRAW
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  drawTiles();
  drawQuestionBoxes();
  drawCoins();
  drawEnemies();
  drawPipesAnimation();
  drawPlayer();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
