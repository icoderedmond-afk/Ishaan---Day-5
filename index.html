<script>
// --- PROCEDURAL TEXTURE & SPRITE GENERATOR ---
// Generates inline pixel art graphics dynamically so no external image loading issues occur.

function createGeneratedTextures(scene) {
    // 1. Sky / Background Gradient Texture
    let bgGraphics = scene.make.graphics({x: 0, y: 0, add: false});
    bgGraphics.fillStyle(0x5c94fc); // Mario Blue Sky
    bgGraphics.fillRect(0, 0, 512, 512);
    // Draw distant clouds/hills
    bgGraphics.fillStyle(0x80d010);
    bgGraphics.fillCircle(100, 450, 120);
    bgGraphics.fillCircle(400, 480, 160);
    bgGraphics.fillStyle(0xffffff, 0.8);
    bgGraphics.fillCircle(200, 100, 40);
    bgGraphics.fillCircle(230, 90, 50);
    bgGraphics.fillCircle(260, 100, 40);
    bgGraphics.generateTexture('bg_sky', 512, 512);

    // 2. Ground / Dirt Block (32x32)
    let groundG = scene.make.graphics({add: false});
    groundG.fillStyle(0xc84c0c); // Brown dirt
    groundG.fillRect(0, 0, 32, 32);
    groundG.fillStyle(0x00a800); // Green grass top layer
    groundG.fillRect(0, 0, 32, 6);
    groundG.lineStyle(2, 0x000000, 0.4);
    groundG.strokeRect(0, 0, 32, 32);
    // Inner brick texture details
    groundG.fillStyle(0x943200);
    groundG.fillRect(4, 10, 8, 8);
    groundG.fillRect(20, 18, 8, 8);
    groundG.generateTexture('ground_tile', 32, 32);

    // 3. Brick Block (32x32)
    let brickG = scene.make.graphics({add: false});
    brickG.fillStyle(0xb84418);
    brickG.fillRect(0, 0, 32, 32);
    brickG.lineStyle(2, 0x000000);
    brickG.strokeRect(0, 0, 32, 32);
    brickG.lineStyle(2, 0x501800);
    brickG.lineBetween(0, 16, 32, 16);
    brickG.lineBetween(16, 0, 16, 16);
    brickG.lineBetween(8, 16, 8, 32);
    brickG.lineBetween(24, 16, 24, 32);
    brickG.generateTexture('brick', 32, 32);

    // 4. Question Block Frames (32x32 - 2 frames for animation)
    for (let f = 0; f < 2; f++) {
        let qG = scene.make.graphics({add: false});
        qG.fillStyle(f === 0 ? 0xf89420 : 0xd87010); // Glowing yellow/orange
        qG.fillRect(0, 0, 32, 32);
        qG.lineStyle(2, 0x000000);
        qG.strokeRect(0, 0, 32, 32);
        // Question mark
        qG.fillStyle(0xffffff);
        qG.fillRect(12, 6, 8, 4);
        qG.fillRect(18, 10, 4, 6);
        qG.fillRect(14, 16, 4, 4);
        qG.fillRect(14, 22, 4, 4);
        qG.generateTexture('q_block_' + f, 32, 32);
    }

    // 5. Pipe Graphic (64x64)
    let pipeG = scene.make.graphics({add: false});
    pipeG.fillStyle(0x00a800); // Mario green
