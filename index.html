<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EvoArena.io</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #12131a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        canvas#gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            background-color: #191b26;
            cursor: crosshair;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffd700;
        }
        #stage-name {
            font-size: 18px;
            font-weight: 700;
            color: #00f2fe;
            margin-top: 2px;
        }
        #xp-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            max-width: 600px;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        #xp-bar {
            width: 0%;
            height: 100%;
            background: #00f2fe;
            transition: width 0.1s ease-out;
        }
        #xp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #leaderboard h3 {
            font-size: 13px;
            text-align: center;
            margin-bottom: 6px;
            color: #ffd700;
            text-transform: uppercase;
        }
        .lb-entry {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .lb-entry.me { color: #00f2fe; }
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 110px;
            height: 110px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #game-over.active {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over h1 {
            font-size: 48px;
            color: #ff4b2b;
